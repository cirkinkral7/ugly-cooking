<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gladius Cooking</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <!-- ══════════════════════════════════════════════════════════ -->
    <!--  MAIN CONTAINER                                              -->
    <!-- ══════════════════════════════════════════════════════════ -->
    <div id="gladius-root" class="hidden">

        <!-- Menu panel: visual chrome only on .menu-card — root stays fully transparent for CEF -->
        <div class="glass-card menu-card" id="glass-card">

            <!-- ─── Header Row ────────────────────────────── -->
            <div class="header-row">
                <div class="brand">
                    <div class="brand-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="rgba(255,255,255,0.92)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M5 4v16M5 7h3M5 11h3M5 15h3"/>
                            <path d="M16 4l2.5 6.5V20M16 10.5h5"/>
                        </svg>
                    </div>
                    <div class="brand-text">
                        <div class="brand-title">GLADIUS</div>
                        <div class="brand-sub">COOKING</div>
                    </div>
                </div>
                <div class="breadcrumb">
                    <button class="back-btn" id="btn-back" aria-label="Geri">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="15 18 9 12 15 6" />
                        </svg>
                    </button>
                    <span id="breadcrumb-text">GLADIUS COOKING</span>
                </div>
            </div>

            <!-- ─── Main Body: 3-column layout ────────────── -->
            <div class="body-grid">

                <!-- Sidebar -->
                <aside class="sidebar">
                    <div class="location-chip">
                        <span class="location-pin" aria-hidden="true">
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M12 21s7-4.35 7-10a7 7 0 10-14 0c0 5.65 7 10 7 10z" fill="rgba(34,197,94,0.22)" stroke="#22c55e" stroke-width="1.5" stroke-linejoin="round"/>
                                <circle cx="12" cy="11" r="2.25" fill="#22c55e"/>
                            </svg>
                        </span>
                        <div class="location-text">
                            <div class="location-label">LOCATION:</div>
                            <div class="location-name" id="shop-name" title="">—</div>
                        </div>
                    </div>

                    <nav class="recipe-list" id="recipe-list">
                        <!-- Recipes injected by JS -->
                    </nav>
                </aside>

                <!-- Center: Recipe Detail -->
                <section class="center-panel">
                    <header class="recipe-header">
                        <div class="recipe-icon" id="recipe-icon">🍔</div>
                        <h1 class="recipe-title" id="recipe-title">—</h1>
                    </header>

                    <div class="steps-grid">

                        <!-- STEP 1 — PREP -->
                        <div class="step-card step-prep">
                            <div class="step-label">STEP 1: PREP</div>
                            <div class="ingredients-grid" id="ingredients-grid">
                                <!-- ingredient tiles injected -->
                            </div>
                        </div>

                        <!-- STEP 2 — COOK -->
                        <div class="step-card step-cook">
                            <div class="step-label">STEP 2: COOK</div>

                            <div class="appliance-row" id="appliance-row">
                                <!-- appliance buttons injected -->
                            </div>

                            <div class="cook-meta">
                                <div class="cook-meta-row">
                                    <span class="cook-meta-key">USE:</span>
                                    <span class="cook-meta-val" id="cook-appliance-label">—</span>
                                </div>
                                <div class="cook-meta-row cook-time-row">
                                    <span class="cook-meta-key">COOKING TIME:</span>
                                    <div class="cook-time-badge" id="cook-time-badge">
                                        <svg viewBox="0 0 40 40" class="cook-time-ring">
                                            <circle cx="20" cy="20" r="17" class="ring-bg" />
                                            <circle cx="20" cy="20" r="17" class="ring-fg" id="cook-time-ring-fg" />
                                        </svg>
                                        <span id="cook-time-text">30s</span>
                                    </div>
                                </div>
                            </div>

                            <div class="minigame-box" id="minigame-box">
                                <div class="minigame-label" id="minigame-title">MINI-GAME</div>
                                <div class="skillcheck-label" id="skillcheck-subtitle">SKILL CHECK</div>
                                <div class="skill-round" id="skill-round-text" aria-live="polite"></div>
                                <div class="skillcheck-bar" id="skillcheck-bar">
                                    <div class="skillcheck-track"></div>
                                    <div class="skillcheck-zone" id="skill-zone"></div>
                                    <div class="skillcheck-indicator" id="skill-indicator"></div>
                                </div>
                                <div class="minigame-hint" id="minigame-hint">PRESS <kbd>E</kbd> WHEN THE MARKER IS IN THE GREEN ZONE</div>
                                <div class="skill-perfect-flash" id="skill-perfect-flash" hidden>Perfect!</div>
                            </div>
                        </div>

                    </div>
                </section>

                <!-- Right Panel: Final Item -->
                <aside class="final-panel">
                    <div class="final-label">FINAL ITEM:</div>
                    <div class="final-name" id="final-name">—</div>
                    <div class="final-image-box">
                        <img id="final-image" alt="" />
                        <div class="final-image-fallback" id="final-image-fallback">🍔</div>
                    </div>
                    <dl class="final-info">
                        <dt>EXPECTED QUALITY:</dt>
                        <dd class="final-quality" id="final-quality">%90+</dd>

                        <dt>ESTIMATED EXPIRATION:</dt>
                        <dd id="final-expiration">24h</dd>

                        <dt>EFFECTS:</dt>
                        <dd class="final-effects" id="final-effects"></dd>
                    </dl>
                </aside>

            </div>

            <!-- ─── Footer Actions ────────────────────────── -->
            <footer class="footer-row">
                <div class="footer-spacer" aria-hidden="true"></div>
                <div class="footer-actions">
                    <button id="btn-start" class="btn btn-primary" disabled>
                        <span>START PREP</span>
                    </button>
                    <button id="btn-cancel" class="btn btn-ghost">CANCEL</button>
                </div>
            </footer>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
